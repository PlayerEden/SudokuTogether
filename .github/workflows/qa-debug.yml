name: GridMates — verified QA update APK

# Manual only: preserve Actions minutes and build exactly the selected ref.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridmates-qa-download
  cancel-in-progress: false

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact selected source
        uses: actions/checkout@v4
      - name: Check release-decision tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Reserve this workflow build number
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || { echo 'Start a new workflow run to reserve a new build number.'; exit 1; }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          code=$((1000 + GITHUB_RUN_NUMBER))
          baseline=$(python3 -c 'import json; print(json.load(open("distribution/qa-update-baseline.json"))["version_code"])')
          (( code > baseline && code <= 2100000000 )) || { echo 'Reserved build number does not exceed the accepted QA baseline.'; exit 1; }
          echo "GRIDMATES_QA_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "### GridMates QA candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "QA build number: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify the existing private QA signer
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SUDOKU_QA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$QA_KEYSTORE_BASE64" ]]; then
            echo 'Missing original QA signing backup. Restore SUDOKU_QA_KEYSTORE_BASE64; do not create a replacement key or uninstall the existing app.' >&2
            exit 1
          fi
          SUDOKU_QA_KEYSTORE_FILE="$RUNNER_TEMP/gridmates-qa-signing/debug.keystore"
          umask 077
          mkdir -p "$(dirname "$SUDOKU_QA_KEYSTORE_FILE")"
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$SUDOKU_QA_KEYSTORE_FILE"
          keytool -exportcert -alias androiddebugkey -storepass android -keystore "$SUDOKU_QA_KEYSTORE_FILE" -file "$RUNNER_TEMP/gridmates-qa-cert.der"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          policy = json.loads(Path('distribution/qa-update-baseline.json').read_text())
          actual = hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'gridmates-qa-cert.der').read_bytes()).hexdigest()
          if actual != policy['signer_sha256']:
              raise SystemExit('Wrong QA certificate: refusing to build an incompatible update.')
          print('Original QA certificate confirmed.')
          PY
          printf 'SUDOKU_QA_KEYSTORE_FILE=%s\n' "$SUDOKU_QA_KEYSTORE_FILE" >> "$GITHUB_ENV"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install the declared Android build tools
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify bundled Gradle wrapper
        run: test -f gradlew && test -f gradle/wrapper/gradle-wrapper.jar
      - name: Run core tests, Android unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin -PgridmatesQaUpdate=true "-PgridmatesQaVersionCode=$GRIDMATES_QA_VERSION_CODE" --console=plain --stacktrace
      - name: Assemble the same-identity QA candidate
        run: ./gradlew :app:assembleDebug -PgridmatesQaUpdate=true "-PgridmatesQaVersionCode=$GRIDMATES_QA_VERSION_CODE" --console=plain --stacktrace
      - name: Verify the final APK before making it downloadable
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GridMates-Sudoku-QA.apk
          python3 scripts/apk_update_preflight.py \
            --apk GridMates-Sudoku-QA.apk \
            --policy distribution/qa-update-baseline.json \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --expected-version-code "$GRIDMATES_QA_VERSION_CODE" \
            --source-commit "$(git rev-parse HEAD)" > GridMates-Sudoku-QA.receipt.json
          sha256sum GridMates-Sudoku-QA.apk > GridMates-Sudoku-QA.apk.sha256
          echo 'Package, signer and increasing build number verified. A fresh native install-over/save rehearsal is still required before recommending this candidate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified candidate with its receipt
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Sudoku-QA-${{ env.GRIDMATES_QA_VERSION_CODE }}-${{ github.sha }}
          path: |
            GridMates-Sudoku-QA.apk
            GridMates-Sudoku-QA.apk.sha256
            GridMates-Sudoku-QA.receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-test-reports-${{ github.run_id }}
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/gridmates-qa-signing" "$RUNNER_TEMP/gridmates-qa-cert.der"
