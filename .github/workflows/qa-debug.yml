name: Sudoku Together — Build & QA APK

# One-time rebuild after the first public compilation repair.
# This trigger is scoped to edits of this file only and will be removed.
on:
  workflow_dispatch:
  public:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-debug.yml

permissions:
  contents: read

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout chosen source branch
        uses: actions/checkout@v4
        with:
          # The default branch contains only docs and this workflow.
          # First public build uses the latest tested development branch.
          ref: ${{ (github.event_name == 'public' || github.event_name == 'push') && 'fix/v0.4-build-readiness' || github.ref_name }}
      - name: Report exact source commit
        run: |
          echo "Building $(git rev-parse --short HEAD) from $(git branch --show-current)"
          echo "### Sudoku Together QA source" >> "$GITHUB_STEP_SUMMARY"
          echo "Built commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled Gradle wrapper
        run: test -f gradlew && test -f gradle/wrapper/gradle-wrapper.jar
      - name: Run core tests, Android unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace
      - name: Assemble isolated test APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
      - name: Copy and checksum test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SudokuTogether-QA.apk
          sha256sum SudokuTogether-QA.apk > SudokuTogether-QA.apk.sha256
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SudokuTogether-QA-${{ github.run_id }}
          path: |
            SudokuTogether-QA.apk
            SudokuTogether-QA.apk.sha256
          retention-days: 14
      - name: Upload test reports even on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SudokuTogether-test-reports-${{ github.run_id }}
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
