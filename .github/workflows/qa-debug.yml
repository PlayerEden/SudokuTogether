name: Sudoku Together — on-demand QA APK

# One-time build trigger, limited to changes of this exact workflow file.
# After this run, restore the workflow to manual-only.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/v0.4-build-readiness
    paths:
      - .github/workflows/qa-debug.yml

permissions:
  contents: read

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout chosen source branch
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled Gradle wrapper
        run: test -f gradlew && test -f gradle/wrapper/gradle-wrapper.jar
      - name: Run core tests, Android unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace
      - name: Assemble isolated test APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
      - name: Copy and checksum test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SudokuTogether-QA.apk
          sha256sum SudokuTogether-QA.apk > SudokuTogether-QA.apk.sha256
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SudokuTogether-QA-${{ github.sha }}
          path: |
            SudokuTogether-QA.apk
            SudokuTogether-QA.apk.sha256
          retention-days: 14
      - name: Upload test reports even on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SudokuTogether-test-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
