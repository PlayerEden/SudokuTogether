name: Build signed Android APK and App Bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDMATES_PRODUCTION_CERT_SHA256: d362dab018a255ccb313582df1e3cf836246e7da1778a198eb1da03a7cfe7cd1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare private signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.SUDOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SUDOKU_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'Configure SUDOKU_KEYSTORE_BASE64 and SUDOKU_KEYSTORE_PASSWORD from the private signing backup before building update APKs.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sudoku-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sudoku-signing/sudoku-together.jks"
          certificate=$(keytool -exportcert -alias sudokutogether -storepass:env KEYSTORE_PASSWORD \
            -keystore "$RUNNER_TEMP/sudoku-signing/sudoku-together.jks" | sha256sum | awk '{print $1}')
          if [ "$certificate" != "$GRIDMATES_PRODUCTION_CERT_SHA256" ]; then
            echo 'Production signer differs from the released Sudoku signing certificate.'
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/sudoku-signing/sudoku-together.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=sudokutogether\n'
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/sudoku-signing/signing.properties"
          chmod 600 "$RUNNER_TEMP/sudoku-signing/"*
      - name: Verify and build
        env:
          SUDOKU_SIGNING_FILE: ${{ runner.temp }}/sudoku-signing/signing.properties
          KEYSTORE_PASSWORD: ${{ secrets.SUDOKU_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk SudokuTogether.apk
          cp app/build/outputs/bundle/release/app-release.aab GridMates-Sudoku.aab
          tools="$ANDROID_HOME/build-tools/35.0.0"
          signer=$("$tools/apksigner" verify --print-certs SudokuTogether.apk | awk '/certificate SHA-256 digest:/ {print $NF}')
          package=$("$tools/aapt" dump badging SudokuTogether.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$signer" = "$GRIDMATES_PRODUCTION_CERT_SHA256"
          test "$package" = com.playereden.sudokutogether
          jarsigner -verify -strict -keystore "$RUNNER_TEMP/sudoku-signing/sudoku-together.jks" \
            -storepass:env KEYSTORE_PASSWORD GridMates-Sudoku.aab sudokutogether
          sha256sum SudokuTogether.apk > SudokuTogether.apk.sha256
          sha256sum GridMates-Sudoku.aab > GridMates-Sudoku.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SudokuTogether-signed-${{ github.sha }}
          path: |
            SudokuTogether.apk
            SudokuTogether.apk.sha256
            GridMates-Sudoku.aab
            GridMates-Sudoku.aab.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/sudoku-signing"
