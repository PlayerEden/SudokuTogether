    const icons=[
      {id:'owl',name:'Owl',family:'Woodland',owned:true},
      {id:'fox',name:'Fox',family:'Woodland',owned:true},
      {id:'rabbit',name:'Rabbit',family:'Woodland',owned:true},
      {id:'bear',name:'Bear',family:'Woodland',owned:true},
      {id:'badger',name:'Badger',family:'Woodland',owned:true},
      {id:'hedgehog',name:'Hedgehog',family:'Woodland',owned:false,requirement:'Complete 4 puzzles',progress:'3 of 4 completed'},
      {id:'grid',name:'Gridkeeper',family:'Basic',symbol:'◆',owned:true},
      {id:'leaf',name:'First Sprout',family:'Basic',symbol:'✿',owned:true},
      {id:'twin',name:'Twin Leaves',family:'Basic',symbol:'❧',owned:false,requirement:'Finish a co-op board',progress:'0 of 1 completed'}
    ];
    let page='play', selectedIcon='owl', family='All', category='icons', name='Player', rival=15, connection='connected', selectedCell=-1, notes=false, activity='', preview=false;
    const settings={vibration:true,numbers:false,notes:false};
    const solution=Array.from({length:81},(_,i)=>(Math.floor(i/9)*3+Math.floor(i/27)+i%9)%9+1);
    const order=Array.from({length:81},(_,i)=>(i*37)%81), givens=new Set(order.slice(0,36));
    const values=solution.map((v,i)=>givens.has(i)?v:0), noteValues={};
    order.slice(36,54).forEach(i=>values[i]=solution[i]);
    selectedCell=order[54];
    const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const iconData=id=>icons.find(x=>x.id===id);
    const avatar=id=>`<span class="gm-avatar">${art[id]?`<img alt="" src="${art[id]}">`:`<span aria-hidden="true">${iconData(id)?.symbol||'?'}</span>`}</span>`;
    const count=()=>values.filter((v,i)=>!givens.has(i)&&v!==0).length;
    const track=(current,max,label,extra='')=>`<div class="gm-track ${extra}" role="progressbar" aria-label="${escape(label)}" aria-valuenow="${current}" aria-valuemin="0" aria-valuemax="${max}"><span style="width:${current/max*100}%"></span></div>`;
    const header=(title,sub,action='help')=>`<header class="gm-header"><div><h2>${title}</h2><div class="gm-small">${sub}</div></div><button type="button" class="gm-icon-button" data-action="${action}" aria-label="${action==='help'?'Help':'Edit profile'}"><i data-lucide="${action==='help'?'circle-help':'pencil'}" aria-hidden="true"></i></button></header>`;
    function play(){
      const own=count(), waiting=connection==='waiting', remote=waiting?0:rival;
      const status=connection==='connected'?'Alex is connected':waiting?'Waiting for another player':'Reconnecting with Alex · Game paused';
      return `${header('Versus','Easy · Nearby match')}
      <section class="gm-opponents" aria-label="Players and race progress"><div class="gm-players">
      <div><div class="gm-person">${avatar(selectedIcon)}<div class="gm-person-text"><div class="gm-name">You</div><small>${escape(name)}</small></div></div>${track(own,45,'Your entries filled')}<div class="gm-count">${own} / 45 filled</div></div>
      <div><div class="gm-person">${waiting?'<span class="gm-avatar" aria-hidden="true">?</span>':avatar('fox')}<div class="gm-person-text"><div class="gm-name">${waiting?'Your rival':'Alex'}</div><small>${waiting?'Not joined yet':'Fox · Woodland'}</small></div></div>${track(remote,45,'Opponent entries filled','gm-rival')}<div class="gm-count" data-rival-count>${remote} / 45 filled</div></div>
      </div><div class="gm-presence ${connection!=='connected'?'gm-offline':''}"><span class="gm-dot" aria-hidden="true"></span><span role="status">${status}</span><button type="button" data-action="chat">Chat</button></div></section>
      <div class="gm-activity" aria-live="polite">${escape(activity||'First valid completed grid wins.')}</div>
      <div class="gm-board" role="group" aria-label="Example Sudoku board">${values.map((v,i)=>`<button type="button" class="gm-cell ${givens.has(i)?'gm-given':''} ${selectedCell===i?'gm-selected':''}" ${givens.has(i)||connection!=='connected'?'disabled':''} data-cell="${i}" aria-label="Row ${Math.floor(i/9)+1}, column ${i%9+1}, ${v||'empty'}">${v||noteValues[i]||''}</button>`).join('')}</div>
      <p class="gm-board-caption">${connection==='connected'?`R${Math.floor(selectedCell/9)+1} · C${selectedCell%9+1} · ${notes?'Add a note':'Enter a number'}`:connection==='waiting'?'Your opponent will appear here when they join.':'Your board is kept while the connection recovers.'}</p>
      <div class="gm-tools"><button type="button" data-action="notes" aria-pressed="${notes}">Notes</button><button type="button" data-action="erase">Erase</button><button type="button" data-action="details">Game details</button></div>
      <div class="gm-keypad">${Array.from({length:9},(_,i)=>`<button type="button" data-digit="${i+1}" ${connection!=='connected'?'disabled':''}>${i+1}</button>`).join('')}<small>Entries filled<br>${own} of 45</small></div>`;
    }
    function collection(){
      const chosen=iconData(selectedIcon), filtered=icons.filter(x=>family==='All'||x.family===family);
      return `${header('Collection','Make it yours')}
      <div class="gm-equipped">${avatar(selectedIcon)}<div><div class="gm-name">${chosen.name}</div><div class="gm-small">Your player icon</div></div><button type="button" data-action="preview">${preview?'Hide preview':'Preview'}</button></div>
      ${preview?`<div class="gm-mini-board" aria-label="Current number style preview">${Array.from({length:9},(_,i)=>`<span>${i+1}</span>`).join('')}</div>`:''}

      ${category==='icons'?`<div class="gm-filter" aria-label="Icon family">${['All','Basic','Woodland'].map(x=>`<button type="button" data-family="${x}" aria-pressed="${family===x}">${x}</button>`).join('')}</div><div class="gm-collection-count">${filtered.filter(x=>x.owned).length} of ${filtered.length} available</div><div class="gm-icon-grid">${filtered.map(x=>`<button type="button" class="gm-collectible" data-icon="${x.id}" aria-pressed="${selectedIcon===x.id}" aria-label="${x.name}, ${selectedIcon===x.id?'selected':x.owned?'available':'locked'}">${avatar(x.id)}<strong>${x.name}</strong><small>${selectedIcon===x.id?'Selected':x.owned?'Available':'Locked · '+(x.id==='twin'?'Co-op':'4 puzzles')}</small></button>`).join('')}</div>`:
      category==='boards'?`<div class="gm-list"><button type="button" class="gm-list-row" data-style="Classic"><div><strong>Classic</strong><small>Your current board</small></div><span>Selected</span></button><button type="button" class="gm-list-row" data-style="Linen"><div><strong>Linen</strong><small>Warm paper</small></div><span>Available</span></button></div>`:
      `<div class="gm-list"><button type="button" class="gm-list-row" data-style="Number colours"><div><strong>Number colours</strong><small>Forest</small></div><span>›</span></button><button type="button" class="gm-list-row" data-style="Number fonts"><div><strong>Number fonts</strong><small>Clear</small></div><span>›</span></button></div>`}`;
    }
    function profile(){return `${header('Profile','Your GridMates','edit')}
      <div class="gm-profile-hero">${avatar(selectedIcon)}<div><strong>${escape(name)}</strong><div class="gm-small">${iconData(selectedIcon).name} · ${iconData(selectedIcon).family}</div><button type="button" data-page="collection">Change player icon</button></div></div>
      <div class="gm-stats"><div class="gm-stat"><strong>3</strong><small>Solo solved</small></div><div class="gm-stat"><strong>1</strong><small>Daily finished</small></div><div class="gm-stat"><strong>0</strong><small>Versus wins</small></div></div>
      <h3 class="gm-section-title">Achievements <span class="gm-small">1 of 9 earned</span></h3>
      <div class="gm-list"><div class="gm-list-row"><span class="gm-badge gm-earned"><i data-lucide="award" aria-hidden="true"></i></span><div><strong>First Grid</strong><small>Your first solo puzzle</small></div><span>Earned</span></div>
      <div class="gm-list-row"><span class="gm-badge"><i data-lucide="sprout" aria-hidden="true"></i></span><div><strong>Steady Hand</strong><small>Complete five solo puzzles</small>${track(3,5,'Steady Hand achievement')}</div><span>3 / 5</span></div>
      <div class="gm-list-row"><span class="gm-badge"><i data-lucide="trophy" aria-hidden="true"></i></span><div><strong>Challenger</strong><small>Win your first versus race</small>${track(0,1,'Challenger achievement')}</div><span>0 / 1</span></div></div>
      <button type="button" class="gm-link" data-action="achievements">View all achievements ›</button>
      <h3 class="gm-section-title">Your play</h3><div class="gm-list"><button type="button" class="gm-list-row" data-action="statistics"><div><strong>Statistics</strong><small>Best times and difficulty records</small></div><span>›</span></button><button type="button" class="gm-list-row" data-action="history"><div><strong>Game history</strong><small>Recent puzzles and matches</small></div><span>›</span></button></div>`;}
    function preferences(){return `${header('Settings','Comfort and preferences')}
      <h3 class="gm-section-title">Comfort & display</h3><div class="gm-list">${[['vibration','Vibration','Board and keypad feedback'],['numbers','Classic number display','One style for all entries']].map(([id,title,sub])=>`<div class="gm-list-row"><div><strong>${title}</strong><small>${sub}</small></div><button type="button" class="gm-switch" role="switch" aria-label="${title}" aria-checked="${settings[id]}" data-setting="${id}"></button></div>`).join('')}</div>
      <h3 class="gm-section-title">Solo assistance</h3><div class="gm-list"><div class="gm-list-row"><div><strong>Clean pencil marks</strong><small>Remove matching notes nearby</small></div><button type="button" class="gm-switch" role="switch" aria-label="Clean pencil marks" aria-checked="${settings.notes}" data-setting="notes"></button></div></div>
      <h3 class="gm-section-title">Help & about</h3><div class="gm-list"><button type="button" class="gm-list-row" data-action="help"><div><strong>How to play</strong><small>Rules, notes and playing together</small></div><span>›</span></button><button type="button" class="gm-list-row" data-action="about"><div><strong>About GridMates</strong><small>Sudoku</small></div><span>›</span></button></div>`;}
    function render(){
      screen.innerHTML=page==='play'?play():page==='collection'?collection():page==='profile'?profile():preferences();
      root.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('nav')){b.removeAttribute('aria-current');if(b.dataset.page===page)b.setAttribute('aria-current','page');}});
      root.querySelector('.gm-controls').hidden=page!=='play';
      root.querySelector('[data-demo="move"]').disabled=connection!=='connected'||rival>=45;
      root.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));
      if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});
    }
    function show(content){detail.innerHTML=content;dialog.showModal();if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});}
    function closeButton(){return '<button type="button" class="gm-link" data-action="close">Close</button>';}
    root.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.page){page=button.dataset.page;render();return;}
      if(button.dataset.demo==='move'){
        if(page!=='play'||connection!=='connected'||rival>=45)return;
        const added=Math.min(3,45-rival);
        rival+=added;
        activity=`Alex filled ${added} more ${added===1?'cell':'cells'} · ${rival} of 45`;
        const indicator=screen.querySelector('.gm-rival');
        indicator.setAttribute('aria-valuenow',String(rival));
        indicator.querySelector('span').style.width=`${rival/45*100}%`;
        screen.querySelector('[data-rival-count]').textContent=`${rival} / 45 filled`;
        screen.querySelector('.gm-activity').textContent=activity;
        button.disabled=rival>=45;
        return;
      }
      if(button.dataset.family){family=button.dataset.family;render();return;}
      if(button.dataset.category){category=button.dataset.category;render();return;}
      if(button.dataset.cell!==undefined){selectedCell=Number(button.dataset.cell);render();return;}
      if(button.dataset.digit&&connection==='connected'){
        if(notes)noteValues[selectedCell]=button.dataset.digit;else{values[selectedCell]=Number(button.dataset.digit);delete noteValues[selectedCell];}
        activity='Your entry is shown in this sample match.';render();return;
      }
      if(button.dataset.setting){const id=button.dataset.setting;settings[id]=!settings[id];render();return;}
      if(button.dataset.icon){const item=iconData(button.dataset.icon);show(`${avatar(item.id)}<h3>${item.name}</h3><p>${item.family} · Player icon</p><p>${item.owned?'Available to use':item.requirement+' · '+item.progress}</p><div class="gm-dialog-actions">${closeButton()}<button type="button" class="gm-primary" data-equip="${item.id}" ${!item.owned||selectedIcon===item.id?'disabled':''}>${selectedIcon===item.id?'Selected':'Use icon'}</button></div>`);return;}
      if(button.dataset.equip){const item=iconData(button.dataset.equip);if(item?.owned){selectedIcon=item.id;dialog.close();render();}return;}
      if(button.dataset.style){show(`<h3>${button.dataset.style}</h3><div class="gm-mini-board">${Array.from({length:9},(_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="gm-dialog-actions">${closeButton()}</div>`);return;}
      const action=button.dataset.action;
      if(action==='close'){dialog.close();return;}
      if(action==='preview'){preview=!preview;render();return;}
      if(action==='notes'){notes=!notes;render();return;}
      if(action==='erase'&&connection==='connected'){values[selectedCell]=0;delete noteValues[selectedCell];render();return;}
      if(action==='edit'){show(`<h3>Edit profile</h3><label for="gm-player-name">Player name</label><input type="text" id="gm-player-name" maxlength="32" value="${escape(name)}"><div class="gm-dialog-actions">${closeButton()}<button type="button" class="gm-primary" data-action="save-name">Save</button></div>`);return;}
      if(action==='save-name'){name=detail.querySelector('input').value.trim()||'Player';dialog.close();render();return;}
      if(action==='chat'){show(`<h3>Say something</h3><div class="gm-tools">${['Good luck!','Nice!','Good game!'].map(t=>`<button type="button" data-reaction="${t}">${t}</button>`).join('')}</div><div class="gm-dialog-actions">${closeButton()}</div>`);return;}
      if(button.dataset.reaction){activity=`You: ${button.dataset.reaction}`;dialog.close();render();return;}
      const messages={help:['Sudoku together','Fill each row, column and 3×3 box with 1–9. In Versus, both players solve their own copy; the first valid finish wins.'],details:['Game details','Easy · Classic 9×9 · Nearby match. Players can see progress, while answers and notes stay on their own board.'],achievements:['Achievements','Earned badges and progress belong together here. First Grid is earned; Steady Hand is 3 of 5 in this example.'],statistics:['Statistics','Solo, Daily, Co-op and Versus records have their own sections. Detailed times stay one tap away from your profile highlights.'],history:['Game history','Recent finishes appear here with their mode, difficulty, time and assistance.'],about:['GridMates: Sudoku','Good puzzles. Good company.']};
      if(messages[action])show(`<h3>${messages[action][0]}</h3><p>${messages[action][1]}</p><div class="gm-dialog-actions">${closeButton()}</div>`);
    });
    root.querySelector('#gm-connection').addEventListener('change',event=>{connection=event.target.value;activity='';render();});
    render();
  })();
  </script>
</div>
